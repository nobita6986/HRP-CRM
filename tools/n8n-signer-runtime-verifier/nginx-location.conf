location = /__t0/n8n12-signer/healthz {
  access_log off;
  proxy_pass http://127.0.0.1:18081/healthz;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /__t0/n8n12-signer/v1/automation/dispatch {
  access_log off;
  client_max_body_size 64k;
  proxy_pass http://127.0.0.1:18081/v1/automation/dispatch;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /__t0/n8n12-signer/ {
  access_log off;
  return 404;
}
